[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatlas"
version = "0.1.0"
description = "LLM-oriented code atlas for understanding code structure"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "xxhash>=3.4.0",
    "pyyaml>=6.0",
]

[project.scripts]
codeatlas = "codeatlas.cli:main"

[tool.setuptools.packages.find]
include = ["codeatlas*"]
